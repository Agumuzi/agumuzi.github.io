<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1024" height="1024" viewBox="0 0 500 500" role="img"
     aria-labelledby="title desc">
  <title id="title">Agumuzi — original lowercase a and mint waterdrop</title>
  <desc id="desc">Editable vector recreation of the first Agumuzi icon. A pale blue lowercase a on a dark navy rounded tile, cyan-to-blue edge lighting, and a mint droplet casting a light ripple onto the bottom edge.</desc>
  <defs>
    <radialGradient id="backdrop" cx="48%" cy="34%" r="83%">
      <stop offset="0" stop-color="#133653"/><stop offset="0.57" stop-color="#0A2036"/><stop offset="1" stop-color="#071525"/>
    </radialGradient>
    <radialGradient id="haloLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1DD7C5" stop-opacity=".22"/><stop offset="1" stop-color="#16D8C1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloRight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2377FF" stop-opacity=".27"/><stop offset="1" stop-color="#1E75FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shellSurface" x1="16%" y1="2%" x2="75%" y2="103%">
      <stop offset="0" stop-color="#153F5B"/><stop offset=".26" stop-color="#08223B"/><stop offset=".65" stop-color="#061729"/><stop offset="1" stop-color="#08172B"/>
    </linearGradient>
    <radialGradient id="shellTop" cx="19%" cy="0" r="85%">
      <stop offset="0" stop-color="#41C9D0" stop-opacity=".40"/><stop offset=".25" stop-color="#227EA9" stop-opacity=".19"/><stop offset=".66" stop-color="#154671" stop-opacity=".03"/><stop offset="1" stop-color="#144D7C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shellRight" cx="99%" cy="50%" r="65%">
      <stop offset="0" stop-color="#1551BD" stop-opacity=".39"/><stop offset=".51" stop-color="#063D93" stop-opacity=".14"/><stop offset="1" stop-color="#012A60" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="75" y1="116" x2="451" y2="374">
      <stop offset="0" stop-color="#5DDDDD"/><stop offset=".27" stop-color="#46B5D2"/><stop offset=".57" stop-color="#2F7EEA"/><stop offset=".85" stop-color="#4073E5"/><stop offset="1" stop-color="#697BFA"/>
    </linearGradient>
    <linearGradient id="bottomRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#89BDFF" stop-opacity="0"/><stop offset=".57" stop-color="#769FFF" stop-opacity=".38"/><stop offset="1" stop-color="#748AFF" stop-opacity=".90"/>
    </linearGradient>
    <linearGradient id="letter" gradientUnits="userSpaceOnUse" x1="188" y1="148" x2="328" y2="326">
      <stop offset="0" stop-color="#FEFEFF"/><stop offset=".50" stop-color="#F5FAFF"/><stop offset="1" stop-color="#D6EAF9"/>
    </linearGradient>
    <linearGradient id="droplet" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#56E9C3"/><stop offset=".42" stop-color="#50DCC0"/><stop offset="1" stop-color="#65C7EF"/>
    </linearGradient>
    <linearGradient id="splashRay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F83CF" stop-opacity=".02"/><stop offset=".5" stop-color="#86A9FF" stop-opacity=".62"/><stop offset="1" stop-color="#A5AFFF" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="splashGlow"><stop offset="0" stop-color="#B3CBFF" stop-opacity=".82"/><stop offset=".28" stop-color="#8AABFF" stop-opacity=".44"/><stop offset="1" stop-color="#7A9FFF" stop-opacity="0"/></radialGradient>
    <clipPath id="tileClip">
      <path d="M 167 63 H 333 C 397 63 445 110 445 176 V 335 C 445 409 408 447 334 447 H 166 C 92 447 55 409 55 335 V 176 C 55 110 103 63 167 63 Z"/>
    </clipPath>
    <filter id="rimBloom" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="thinGlow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="reflectedLight" x="-100%" y="-200%" width="300%" height="500%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- Clip the complete icon, including the backdrop and all glow filters, to the
         transformed tile silhouette. Outside the rounded border alpha is zero. -->
    <clipPath id="tileAlphaClip" clipPathUnits="userSpaceOnUse">
      <path d="M 167 63 H 333 C 397 63 445 110 445 176 V 335 C 445 409 408 447 334 447 H 166 C 92 447 55 409 55 335 V 176 C 55 110 103 63 167 63 Z" transform="translate(250 250) scale(1.105) translate(-250 -250)"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tileAlphaClip)">
  <!-- Entire image is editable vector paths, gradients and filters; no embedded raster image. -->
  <rect width="500" height="500" fill="url(#backdrop)"/>
  <ellipse cx="96" cy="174" rx="154" ry="214" fill="url(#haloLeft)"/>
  <ellipse cx="412" cy="301" rx="161" ry="223" fill="url(#haloRight)"/>
  <g id="artwork" transform="translate(250 250) scale(1.105) translate(-250 -250)">
  <path id="tile" d="M 167 63 H 333 C 397 63 445 110 445 176 V 335 C 445 409 408 447 334 447 H 166 C 92 447 55 409 55 335 V 176 C 55 110 103 63 167 63 Z"
        fill="url(#shellSurface)" stroke="url(#rim)" stroke-width="6" opacity=".64" filter="url(#rimBloom)"/>
  <path d="M 167 63 H 333 C 397 63 445 110 445 176 V 335 C 445 409 408 447 334 447 H 166 C 92 447 55 409 55 335 V 176 C 55 110 103 63 167 63 Z" fill="url(#shellSurface)" stroke="url(#rim)" stroke-width="2.6"/>
  <g clip-path="url(#tileClip)">
    <rect x="55" y="63" width="390" height="384" fill="url(#shellTop)"/>
    <rect x="55" y="63" width="390" height="384" fill="url(#shellRight)"/>
    <ellipse cx="249" cy="438" rx="165" ry="19" fill="url(#splashGlow)" opacity=".2"/>
    <!-- The waterdrop is suspended just above its diffuse impact reflection. -->
    <ellipse cx="251" cy="442" rx="35" ry="19" fill="url(#splashGlow)"/>
    <path d="M239 425 C247 430 250 433 246 439 C242 444 238 447 229 451 L274 451 C263 447 259 440 261 435 C262 431 264 427 266 425 Z"
          fill="url(#splashRay)" filter="url(#reflectedLight)" opacity=".86"/>
    <path d="M240 429 C248 435 247 438 244 442 L235 447 H268 C255 441 257 435 263 428"
          fill="url(#splashRay)" opacity=".46"/>
    <!-- Lower boundary carries the subtle spreading ripple. -->
    <path d="M89 443 C154 449 220 447 250 447 C289 447 345 449 407 439"
          fill="none" stroke="url(#bottomRim)" stroke-width="4" opacity=".60"/>
