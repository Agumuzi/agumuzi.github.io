    <circle cx="251" cy="406" r="22.8" fill="url(#droplet)"/>
  </g>
  <path d="M 167 63 H 333 C 397 63 445 110 445 176 V 335 C 445 409 408 447 334 447 H 166 C 92 447 55 409 55 335 V 176 C 55 110 103 63 167 63 Z" fill="none" stroke="url(#rim)" stroke-width="1.5" opacity=".67"/>
  </g>
  </g>
</svg>